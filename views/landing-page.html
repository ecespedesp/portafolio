<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="/css/style-lp.css">
</head>

<body>
    <header>
        <h1>Calculadora basica</h1>
        
        
    </header>

    <main>

        <div class="container">
            <div class="calculadora">
                <div class="visor">
                    <input id="visor-input" type="text" value="0">
                </div>
                <div class="pad">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>+</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>-</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>*</button>
                    <button>.</button>
                    <button>0</button>
                    <button>=</button>
                    <button>/</button>
                </div>
            </div>
        </div>
        
    </main>

    <script src="/js/scripts-lp.js"></script>
</body>
</html>
